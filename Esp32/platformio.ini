; ESP32-S3 ARCC-совместимая плата вывода + веб-конфигуратор (plan.md)
; Железо: ESP32-S3 DevKitC-30N (N16R8: 16MB flash, 8MB octal PSRAM)
; Flash: pio run -t upload            (USB-Serial-JTAG, .bin)
; FS:    pio run -t buildfs && pio run -t uploadfs

; Диагностическая сборка: лог на USB-CDC (COM ПК), ARCC по CDC отключён.
; Смотреть: python -m platformio run -e diag -t upload && python -m platformio device monitor -e diag
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

[env:esp32s3]
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
src_filter = +<*> -<led_test.cpp>
build_flags =
    -DCDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    ESP32Async/ESPAsyncWebServer@^3.7.0

[env:diag]
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
src_filter = +<*> -<led_test.cpp>
build_flags =
    ${env:esp32s3.build_flags}
    -DDIAG_USE_CDC
lib_deps =
    ${env:esp32s3.lib_deps}

[env:ledtest]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
src_filter = -<*> +<led_test.cpp>
